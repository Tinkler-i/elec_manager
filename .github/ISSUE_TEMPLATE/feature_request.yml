name: 功能建议
description: 提一个功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便？什么场景下会遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 想要的效果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 有的话写一下，以及为什么不用。
    validations:
      required: false
