name: Build fnOS App (fpk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      # 一个架构挂掉不要连累另一个：上一次 arm64 失败把已经跑完的 amd64 job 也取消了，
      # 结果连健康的产物都拿不到。
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            fnpack_arch: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            # 官方文档写的是 linux-arm64，但 1.2.3 实际发布的资源名是 linux-arm
            # （linux-arm64 返回 404；下载后核过 ELF e_machine=0xB7，是 AArch64）
            fnpack_arch: linux-arm
    env:
      # 只影响 action 自身的运行时，不影响构建用的 Node —— 构建 Node 由下面
      # setup-node 的 node-version: 22 定死，better-sqlite3 的 ABI 跟着它走。
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须与飞牛 nodejs_v22 的 ABI 一致（Node 22 → NODE_MODULE_VERSION 127）。
          # 这里原来写的是 24，编出来的 better-sqlite3 是 ABI 137，装到设备上
          # ERR_DLOPEN_FAILED，登录接口直接 500。下一道步骤会拦住这种情况。
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci 会校验 package-lock.json 与 package.json 一致。原来写 npm install 是为了
        # 绕开锁文件里缺的两条 @emnapi（已修），代价是锁文件完全不校验。
        # 注意锁文件要用 npm 10 维护（Node 22 自带的就是 npm 10）：npm 11 跑 install
        # 会把 @emnapi/core、@emnapi/runtime 又删掉，CI 的 npm ci 随即 EUSAGE 失败。
        run: npm ci

      - name: 校验 Node ABI 与飞牛 nodejs_v22 一致
        run: |
          ABI="$(node -p 'process.versions.modules')"
          echo "runner Node $(node -v)，NODE_MODULE_VERSION=${ABI}"
          if [ "$ABI" != "127" ]; then
            echo "::error::CI 的 Node ABI 是 ${ABI}，飞牛 nodejs_v22 需要 127（Node 22）"
            echo "::error::这样编出来的 better-sqlite3 在设备上会 ERR_DLOPEN_FAILED"
            exit 1
          fi
          node -e "const D=require('better-sqlite3'); new D(':memory:').exec('create table t(a)'); console.log('better-sqlite3 在 ABI 127 下可加载')"

      # 发版前的质量门。build-fpk.yml 原来只构建，tag 一打就直接出包，
      # 烂代码能进 Release。下面几步失败就中止，不出包。
      #
      # 先 typegen 再 tsc：tsconfig 的 include 里有 `.next/types/**/*.ts`，那是 typegen
      # 生成的路由类型。干净检出时这个目录不存在 —— tsc 不会因此报错（实测），但会少查
      # 这一层。先生成出来，类型检查才覆盖到生成的路由类型。
      - name: 生成 Next 类型声明
        run: ./node_modules/.bin/next typegen

      - name: 类型检查
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: 单元测试（图表与统计口径）
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Prepare fnOS package
        run: |
          PACKAGE_DIR="fnos/App.Native.ElecMeter"
          SERVER_DIR="${PACKAGE_DIR}/app/server"

          rm -rf "${SERVER_DIR}"
          mkdir -p "${SERVER_DIR}"

          cp -r .next/standalone/. "${SERVER_DIR}/"

          mkdir -p "${SERVER_DIR}/.next/static"
          cp -r .next/static/. "${SERVER_DIR}/.next/static/"

          cp -r public "${SERVER_DIR}/public"

          mkdir -p "${SERVER_DIR}/data"

      - name: Clean unnecessary files
        run: |
          SERVER_DIR="fnos/App.Native.ElecMeter/app/server"

          # better-sqlite3: 替换哈希模块名
          BS3_HASH_NAME=$(grep -roh 'better-sqlite3-[a-f0-9]\{16,\}' "${SERVER_DIR}/.next/server/" 2>/dev/null | sort -u | head -1)
          if [ -n "${BS3_HASH_NAME}" ]; then
            echo "Replacing ${BS3_HASH_NAME} -> better-sqlite3"
            find "${SERVER_DIR}/.next/server" -type f \( -name '*.js' -o -name '*.json' \) -exec sed -i "s/${BS3_HASH_NAME}/better-sqlite3/g" {} + 2>/dev/null || true
          fi

          # @modelcontextprotocol/sdk: 替换哈希模块名
          MCP_HASH_NAME=$(grep -roh '@modelcontextprotocol/sdk-[a-f0-9]\{16,\}' "${SERVER_DIR}/.next/server/" 2>/dev/null | sort -u | head -1)
          if [ -n "${MCP_HASH_NAME}" ]; then
            echo "Replacing ${MCP_HASH_NAME} -> @modelcontextprotocol/sdk"
            find "${SERVER_DIR}/.next/server" -type f \( -name '*.js' -o -name '*.json' \) -exec sed -i "s|${MCP_HASH_NAME}|@modelcontextprotocol/sdk|g" {} + 2>/dev/null || true
          fi

          rm -rf "${SERVER_DIR}/.next/node_modules" 2>/dev/null || true
          rm -rf "${SERVER_DIR}/node_modules/better-sqlite3" 2>/dev/null || true
          cp -r node_modules/better-sqlite3 "${SERVER_DIR}/node_modules/better-sqlite3"

          # 复制 @modelcontextprotocol/sdk（serverExternalPackages）。
          # standalone 里也有一份，但是 Next 按依赖图裁剪过的子集（实测 83 个文件，
          # 项目 node_modules 里是 1155 个）。这里覆盖成完整的项目副本。
          if [ -d "node_modules/@modelcontextprotocol" ]; then
            echo "Copying @modelcontextprotocol/sdk"
            mkdir -p "${SERVER_DIR}/node_modules/@modelcontextprotocol"
            rm -rf "${SERVER_DIR}/node_modules/@modelcontextprotocol/sdk" 2>/dev/null || true
            cp -r node_modules/@modelcontextprotocol/sdk "${SERVER_DIR}/node_modules/@modelcontextprotocol/sdk"
          fi

          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "amd64" ]; then
            SHARP_KEEP="x64"
          else
            SHARP_KEEP="arm64"
          fi
          for sharp_dir in "${SERVER_DIR}/node_modules/@img"/sharp-* "${SERVER_DIR}/node_modules/@img"/sharp-libvips-*; do
            [ -d "$sharp_dir" ] || continue
            dirname=$(basename "$sharp_dir")
            if echo "$dirname" | grep -q "linux-${SHARP_KEEP}"; then
              continue
            fi
            rm -rf "$sharp_dir"
          done

          rm -f "${SERVER_DIR}/node_modules/next/dist/server/capsize-font-metrics.json" 2>/dev/null || true

          for bs3dir in $(find "${SERVER_DIR}" -type d -name "better-sqlite3*" 2>/dev/null); do
            rm -rf "${bs3dir}/deps" 2>/dev/null || true
            rm -rf "${bs3dir}/src" 2>/dev/null || true
            rm -rf "${bs3dir}/build/Release/obj" 2>/dev/null || true
            rm -f "${bs3dir}/binding.gyp" 2>/dev/null || true
          done

          find "${SERVER_DIR}" -type f \( \
            -iname "README*" -o -iname "CHANGELOG*" -o -iname "HISTORY*" \
            -o -iname "LICENSE*" -o -iname "LICENCE*" -o -iname "NOTICE*" \
            -o -iname "*.md" -o -iname "*.gyp" -o -iname "*.gypi" \
            -o -iname ".npmignore" -o -iname ".eslintrc*" -o -iname ".prettierrc*" \
            -o -iname "Makefile" -o -iname "*.ts" -o -iname "*.map" \
            -o -iname "*.c" -o -iname "*.cc" -o -iname "*.cpp" -o -iname "*.h" -o -iname "*.hpp" \
            -o -iname "test.js" -o -iname "test-*.js" -o -iname "*.test.js" \
            -o -iname "*.spec.js" -o -iname "binding.gyp" \
          \) -delete 2>/dev/null || true

          find "${SERVER_DIR}" -type d -empty -delete 2>/dev/null || true

      - name: Set manifest platform
        run: |
          # 包里带 better-sqlite3 的原生 .node，platform 不能是 all ——
          # 否则 ARM 设备会装上 amd64 包，装完打不开。按矩阵架构写死。
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "amd64" ]; then
            PLATFORM=x86
          else
            PLATFORM=arm
          fi
          MANIFEST="fnos/App.Native.ElecMeter/manifest"
          sed -i "s/^platform=.*/platform=${PLATFORM}/" "$MANIFEST"
          echo "manifest: $(grep '^platform=' "$MANIFEST")"

      - name: Download fnpack & Build fpk
        run: |
          FNPACK_VERSION="1.2.3"
          FNPACK_ARCH="${{ matrix.fnpack_arch }}"
          curl -fL -o fnos/fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-${FNPACK_ARCH}"
          chmod +x fnos/fnpack

          cd fnos/App.Native.ElecMeter
          ../fnpack build

      - name: 校验包内原生模块能加载
        run: |
          # 前一道只验了仓库里的 node_modules，这里验真正打进 fpk 的那份 ——
          # 打包过程会删文件、换目录，验到成品才算数。
          PKG="fnos/App.Native.ElecMeter"
          TMP="$(mktemp -d)"
          tar -xzf "${PKG}/App.Native.ElecMeter.fpk" -C "$TMP"
          tar -xzf "$TMP/app.tgz" -C "$TMP"
          MOD="$TMP/server/node_modules/better-sqlite3" node -e "
            const D = require(process.env.MOD);
            new D(':memory:').exec('create table t(a)');
            console.log('包内 better-sqlite3 可加载，ABI =', process.versions.modules);
          "
          rm -rf "$TMP"

      - name: Rename fpk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          ARCH="${{ matrix.arch }}"
          SRC="fnos/App.Native.ElecMeter/App.Native.ElecMeter.fpk"
          DST="fnos/App.Native.ElecMeter/elec-meter-v${VERSION}-${ARCH}.fpk"
          mv "$SRC" "$DST"
          echo "=== 产物 ==="
          ls -lh "$DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: fnos/App.Native.ElecMeter/elec-meter-*.fpk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: |
          echo "=== 下载的文件 ==="
          find artifacts -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/elec-meter-*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
