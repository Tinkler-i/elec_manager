name: 一致性检查

# 把几条容易「改了一边忘了另一边」的约定变成 CI 检查，不依赖谁记得去看文档。
#
# pull_request → guard job（改动一致性、版本号、锁文件、范围过宽）
# push(master) → commit-msg job（提交信息规范）
#
# 为什么 push 也要挂：master 是可以直接推的，只在 PR 上查就会漏掉直接推上来的提交 ——
# 那样这道门对「本次推送进来的提交」实际上是不存在的。
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # PR 用 PR 号（新推送取消旧的，合理）；push 用 ref 且**不取消** ——
  # 取消一次 push 的检查＝那批提交永远不会被查（下一次的 before 已经往前走了）。
  group: consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: 一致性检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 收集本次改动
        run: |
          set -euo pipefail
          export LC_ALL=C
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          echo "改动文件："
          cat /tmp/changed.txt

      # 跨语言的约定没有编译器帮忙：fnos 生命周期脚本导出的环境变量，
      # 应用代码里必须有人读。改名字只改一边，设备上就是「数据写错地方」。
      - name: 环境变量一致性（fnOS 启动脚本 ↔ 应用代码）
        run: |
          set -euo pipefail
          export LC_ALL=C
          grep -rhoE 'ELEC_[A-Z0-9_]+' fnos/App.Native.ElecMeter/cmd/ 2>/dev/null | sort -u > /tmp/shell-vars.txt || true
          grep -rhoE 'process\.env\.ELEC_[A-Z0-9_]+' src/ 2>/dev/null | sed 's/process\.env\.//' | sort -u > /tmp/ts-vars.txt || true
          echo "fnOS 生命周期脚本里出现的："; cat /tmp/shell-vars.txt
          echo "src/ 里读取的："; cat /tmp/ts-vars.txt
          # 只查单向：脚本设了但代码没人读 = 八成改漏了一边。
          # 反过来（代码读的比脚本设的多）是正常的，那些是可选的覆盖项。
          UNREAD="$(comm -23 /tmp/shell-vars.txt /tmp/ts-vars.txt)"
          if [ -n "$UNREAD" ]; then
            echo "::error::这些变量在 fnOS 生命周期脚本里设置了，但 src/ 里没有任何地方读它：$(echo $UNREAD | tr '\n' ' ')"
            echo "::error::要么是改名只改了一边，要么是脚本里多导出了。"
            exit 1
          fi
          echo "✅ 一致"

      - name: 版本号守卫（只在发版时改）
        run: |
          set -euo pipefail
          export LC_ALL=C
          if ! grep -qE '^(package\.json|fnos/App\.Native\.ElecMeter/manifest)$' /tmp/changed.txt; then
            echo "本次没动 package.json / manifest，跳过"
            exit 0
          fi
          if git diff "origin/${{ github.base_ref }}...HEAD" -- package.json fnos/App.Native.ElecMeter/manifest \
             | grep -qE '^[+-](\s*"version"|version=)'; then
            echo "::error::这个 PR 改了版本号。版本号在发版时统一改，平时不动；"
            echo "::error::发版由仓库所有者在 master 上打 tag 完成。"
            exit 1
          fi
          echo "✅ 版本号没动"

      - name: 依赖锁文件提示
        run: |
          set -euo pipefail
          export LC_ALL=C
          if grep -qE '^package-lock\.json$' /tmp/changed.txt; then
            echo "::warning file=package-lock.json::锁文件被改了。冲突不要手工合并 —— 删掉重新 npm install 生成。手工补的条目在别的平台上会让 npm ci 直接 EUSAGE 失败。"
          fi
          echo "✅ 检查完毕"

      - name: 判断改动范围
        id: scope
        run: |
          set -euo pipefail
          export LC_ALL=C
          if grep -qE '^src/' /tmp/changed.txt && grep -qE '^(\.github/workflows/|fnos/build\.sh)' /tmp/changed.txt; then
            echo "wide=1" >> "$GITHUB_OUTPUT"
            # 先发一条 warning 标注。这一步不需要任何额外权限，
            # 即使下面的 PR 留言因为 token 只有读权限而失败，信息也不会丢。
            echo "::warning::这个 PR 同时改了 src/** 和构建/打包配置，改动范围偏宽，建议拆分或说明原因。"
          else
            echo "wide=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 范围过宽时在 PR 上留言
        if: steps.scope.outputs.wide == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARK='<!-- consistency-check:wide-scope -->'
          BODY="${MARK}
          这个 PR 同时改了应用代码（\`src/**\`）和构建/打包配置（\`.github/workflows/**\`、\`fnos/build.sh\`）。

          范围这么宽的 PR 不好 review，改动的影响面也容易被低估。建议拆开，或者在这里说明为什么必须一起改。"
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$MARK"; then
            echo "已经有提醒了，不重复留言"
          else
            gh pr comment "$PR" --body "$BODY"
          fi

      # 拦截点的前提：.githooks/commit-msg 必须存在、带可执行位、且是 LF 行尾。
      # 这三样缺任何一样，钩子都是**静默失效** —— 没人收到提示，提交照样过。
      # 那就是「看起来在拦、其实没拦」，所以在这里一次全盯住。
      - name: commit-msg 钩子可用（本地拦截点的前提）
        run: |
          set -euo pipefail
          HOOK=.githooks/commit-msg
          if [ ! -f "$HOOK" ]; then
            echo "::error::$HOOK 不存在 —— 提交信息唯一的本地拦截点没了，只剩 CI 的事后检查。"
            exit 1
          fi
          if [ ! -x "$HOOK" ]; then
            echo "::error::$HOOK 没有可执行位。git 不会执行它，钩子静默失效。"
            echo "::error::修法：git update-index --chmod=+x $HOOK（然后提交这个模式变更）"
            exit 1
          fi
          # 用 od 而不是直接 grep 文件：MSYS/Git Bash 的 grep 按文本模式读，会把 CRLF
          # 归一化掉 —— 在 Windows 上永远看不到 CR，本地就没法验这条。od -An -c 把 CR
          # 渲染成可见的 \r 两个字符，本地和 CI 用的是同一个判据。
          if od -An -c "$HOOK" | grep -qF '\r'; then
            echo "::error::$HOOK 里有 CR（CRLF 行尾）。POSIX 上 shebang 会变成 #!/bin/sh\\r，"
            echo "::error::钩子根本起不来。修法：在 .gitattributes 加一行  .githooks/* text eol=lf"
            exit 1
          fi
          echo "✅ $HOOK 存在、可执行、LF 行尾"

  # 提交信息规范（CONTRIBUTING.md 的「提交」一节）。规范只写在文档里等于没有规矩，
  # 这里让它变成一道**硬门**：标题格式 / 标题 ≤50 字 / 正文非空行 ≤5 / 不出现 task-N。
  # 超了就是红，不是警告。判据与 .githooks/commit-msg 共用同一份（scripts/lib/commit-message-rules.mjs）。
  #
  # 两条路径都挂：
  #   · push → before..after，管直接推上来的（直推 master 时这是**唯一**覆盖它的路径）
  #   · pull_request → base.sha..head.sha，管走 PR 的；配必需检查能在合并前挡住
  # 注意：push 侧是**事后**才红的 —— 提交已经进 master 了。真正能拦在提交产生之前的
  # 只有本地 .githooks/commit-msg 钩子，这里只是兜底与留痕。
  commit-msg:
    name: 提交信息规范
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 要算差集就得有完整历史；默认的 fetch-depth: 1 只拿得到一个提交，那样这道门会假绿。
          fetch-depth: 0

      # 检查脚本是 node 跑的。runner 镜像里自带 node，但别依赖这个隐含前提。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查本次涉及的提交信息
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-pushed-commits.sh
