name: CI

# 每次推送与 PR 都跑一遍「类型检查 → lint → 单测 → 构建」。
# 不在这里构建镜像：镜像走 docker.yml —— 发版和手动触发时构建并推送，
# PR 改了构建相关文件时只构建 amd64 做冒烟、不推送。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / Lint / 单测 / 构建
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与飞牛 nodejs_v22、Dockerfile 的基础镜像保持一致：
          # better-sqlite3 是原生模块，Node 大版本换了 ABI 就换了。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typegen / tsc 直接调可执行文件：它们是工具链命令，不是项目语义的一部分。
      # 测试走 `npm test`，入口只留一个，免得改了 package.json 而 CI 没跟上。
      #
      # 先 typegen 再 tsc：tsconfig 的 include 里有 `.next/types/**/*.ts`，那是 typegen
      # 生成的路由类型。干净检出时这个目录不存在 —— tsc 不会因此报错（实测），但会少查
      # 这一层。先生成出来，类型检查才覆盖到生成的路由类型。
      # 见 node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md。
      - name: 生成 Next 类型声明
        run: ./node_modules/.bin/next typegen

      - name: 类型检查
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: 单元测试（图表与统计口径）
        run: npm test

      - name: 构建
        run: npm run build

      # 显式再跑一次构建后检查。它同时挂在 package.json 的 postbuild 上（`npm run build`
      # 会自动触发），这里显式跑有两个好处：日志里看得见，不用翻 build 输出；postbuild
      # 被误删或改名时这一步仍然拦得住。判据见脚本头部 —— standalone 顶层出现任何
      # 「仓库根目录里也存在」的条目就报错。
      - name: 检查 standalone 顶层干净
        run: node scripts/lib/check-standalone-clean.mjs

      # 构建后的真实进程校验：都依赖 .next/standalone/server.js，必须在 build 之后，
      # 所以不能并进 `npm test`。两个脚本各自起真进程、用临时数据目录和固定端口
      # （冷启动 16801/16802、备份 16811/16812），不需要额外环境变量。
      - name: 冷启动回归（A5）
        run: node scripts/test-cold-start.mjs

      # 备份这条路走的是 HTTP 路由：数据层单测能钉住 backupDatabase() 内部的 await，
      # 但钉不住「route 自己忘了 await 助手」。只有真打一次 HTTP 才能发现。
      - name: 备份往返回归（返回时文件必须已完整）
        run: node scripts/test-backup-http.mjs

      # e2e 要真浏览器。先**显式解析一次路径**：找不到就在这里红。
      # 不这么做的话，探测失败会烂在后面的步骤里、或者更糟 —— 静默跳过等于这道门不存在。
      # GitHub 的 ubuntu runner 自带 Google Chrome，装在 /usr/bin/google-chrome；
      # 探测顺序见 scripts/lib/cdp.mjs 的 browserCandidates()。
      - name: 确认 headless 浏览器可用（e2e 的前提）
        run: |
          set -euo pipefail
          node --input-type=module -e "import { resolveBrowserPath } from './scripts/lib/cdp.mjs'; console.log('  e2e 用的浏览器：' + resolveBrowserPath());"

      # 端到端：临时库 + 真实 headless Chrome 跑页面流程（见 docs/e2e.md）。
      # 复用上面「构建」那步产出的 .next/standalone，**不额外构建** —— 所以它只多花十几秒。
      # 这一步红了 CI 就该红：**不要加 continue-on-error**，那会把它变成装饰品。
      - name: 端到端（e2e）
        run: npm run test:e2e

      # 门自检，两件事：
      #   ① **这道门有没有被豁免**。质量门里不允许出现「红了也不管」的步骤 —— 那是最彻底的
      #      装饰。这条工作流不该有任何非致命步骤；真有需要，把那个步骤挪出 ci.yml。
      #   ② 插一条必然失败的用例，确认失败**真的**会变成非零退出码（退出判据与上面的 e2e 共用一行）。
      # 这一步绿 = 「这道门会响」，不是「用例都过」。只跑那一条，不重跑整套。
      - name: e2e 门自检（会响 + 没被豁免）
        run: |
          set -euo pipefail
          node -e "const yaml=require('js-yaml'),fs=require('fs');const d=yaml.load(fs.readFileSync('.github/workflows/ci.yml','utf8'));const exempt=d.jobs.check.steps.filter((s)=>s['continue-on-error']);if(exempt.length){console.error('::error::这些步骤被豁免了（红了也不管）：'+exempt.map((s)=>s.name||s.uses).join(', '));process.exit(1)}console.log('  ✅ 这条工作流里没有豁免步骤');"
          npm run test:e2e -- --self-check
