name: CI

# 每次推送与 PR 都跑一遍「类型检查 → lint → 单测 → 构建」。
# 不在这里构建镜像：镜像走 docker.yml —— 发版和手动触发时构建并推送，
# PR 改了构建相关文件时只构建 amd64 做冒烟、不推送。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / Lint / 单测 / 构建
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与飞牛 nodejs_v22、Dockerfile 的基础镜像保持一致：
          # better-sqlite3 是原生模块，Node 大版本换了 ABI 就换了。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typegen / tsc 直接调可执行文件：它们是工具链命令，不是项目语义的一部分。
      # 测试走 `npm test`，入口只留一个，免得改了 package.json 而 CI 没跟上。
      #
      # 先 typegen 再 tsc：tsconfig 的 include 里有 `.next/types/**/*.ts`，那是 typegen
      # 生成的路由类型。干净检出时这个目录不存在 —— tsc 不会因此报错（实测），但会少查
      # 这一层。先生成出来，类型检查才覆盖到生成的路由类型。
      # 见 node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md。
      - name: 生成 Next 类型声明
        run: ./node_modules/.bin/next typegen

      - name: 类型检查
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: 单元测试（图表与统计口径）
        run: npm test

      - name: 构建
        run: npm run build
